{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <!-- Profile Header -->
    <div class="content-section" style="margin-bottom: 1.5rem;">
        <div style="text-align: center; margin-bottom: 0.5rem;">
            <div style="color: var(--term-dim); font-size: 0.75rem;">$ whoami</div>
        </div>
        <div style="display: flex; align-items: center; gap: 1.5rem; padding: 1rem 0;">
            <div style="position: relative;">
                <img src="{{ user.profile.image.url }}" alt="{{ user.username }}"
                     style="width: 80px; height: 80px; border-radius: 4px; border: 2px solid var(--term-green); object-fit: cover;">
                <div style="position: absolute; bottom: -4px; right: -4px; width: 12px; height: 12px; background: var(--term-green); border-radius: 50%; border: 2px solid var(--term-bg);"></div>
            </div>
            <div>
                <div style="color: var(--term-cyan); font-size: 1.25rem; font-weight: 600;">{{ user.username }}</div>
                <div style="color: var(--term-gray); font-size: 0.875rem;">{{ user.email }}</div>
                <div style="color: var(--term-dim); font-size: 0.75rem; margin-top: 0.25rem;">
                    <span style="color: var(--term-green);">●</span> online
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Form -->
    <div class="content-section">
        <div style="margin-bottom: 1.5rem;">
            <div style="color: var(--term-dim); font-size: 0.75rem; margin-bottom: 0.5rem;">$ nano ~/.profile</div>
            <div style="color: var(--term-cyan); font-size: 1rem;">Edit Profile</div>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <fieldset class="form-group" style="border: none; padding: 0; margin: 0;">
                {{ u_form|crispy }}
                {{ p_form|crispy }}
            </fieldset>
            <div class="form-group" style="margin-top: 1.5rem;">
                <button class="btn w-100" type="submit" style="padding: 0.75rem;">
                    <span style="color: var(--term-cyan);">$</span> save_changes
                </button>
            </div>
        </form>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
        <span style="color: var(--term-dim); font-size: 0.75rem;">
            Press <span style="color: var(--term-cyan);">Ctrl+K</span> for quick navigation
        </span>
    </div>
</div>
{% endblock content %}
