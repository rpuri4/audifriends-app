{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div style="max-width: 400px; margin: 2rem auto;">
    <div class="content-section">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="color: var(--term-dim); font-size: 0.75rem; margin-bottom: 0.5rem;">$ ./register --new-user</div>
            <h2 style="color: var(--term-cyan); font-size: 1.25rem; margin: 0;">Create Account</h2>
        </div>

        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group" style="border: none; padding: 0; margin: 0;">
                {{ form|crispy }}
            </fieldset>
            <div class="form-group" style="margin-top: 1.5rem;">
                <button class="btn w-100" type="submit" style="padding: 0.75rem;">
                    <span style="color: var(--term-cyan);">$</span> create_account
                </button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--term-border);">
            <span style="color: var(--term-gray); font-size: 0.875rem;">
                Already registered? <a href="{% url 'login' %}">./login</a>
            </span>
        </div>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
        <span style="color: var(--term-dim); font-size: 0.75rem;">
            Press <span style="color: var(--term-cyan);">Ctrl+K</span> for quick navigation
        </span>
    </div>
</div>
{% endblock content %}
