{% extends "blog/base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 3rem auto; text-align: center;">
    <div class="content-section">
        <div style="color: var(--term-dim); font-size: 0.75rem; margin-bottom: 0.5rem;">$ ./logout</div>
        <div style="color: var(--term-green); font-size: 1.5rem; margin-bottom: 1rem;">Session terminated</div>
        <div style="color: var(--term-gray); margin-bottom: 1.5rem;">You have been successfully logged out.</div>

        <a href="{% url 'login' %}" class="btn" style="padding: 0.75rem 1.5rem;">
            <span style="color: var(--term-cyan);">$</span> ./login
        </a>
    </div>

    <div style="margin-top: 1.5rem; color: var(--term-dim); font-size: 0.75rem;">
        <span style="color: var(--term-green);">user@audifriends</span>:<span style="color: var(--term-cyan);">~</span>$ <span class="cursor" style="display: inline-block; width: 8px; height: 1em; background: var(--term-green); animation: blink 1s infinite; vertical-align: text-bottom;"></span>
    </div>
</div>

<style>
@keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
}
</style>
{% endblock content %}
