<div style="background: var(--term-bg); border: 1px solid var(--term-cyan); padding: 1rem; margin-top: 1rem;">
    <div style="display: flex; align-items: flex-start; gap: 1rem;">
        <div style="color: var(--term-cyan); font-size: 1.5rem; flex-shrink: 0;">></div>
        <div style="flex: 1;">
            <div style="color: var(--term-dim); font-size: 0.75rem; margin-bottom: 0.5rem;">
                AI_RECOMMENDATION_v1.0
            </div>
            <div style="margin-bottom: 1rem;">
                <span style="color: var(--term-green); font-size: 1.1rem; font-weight: 600;">{{ recommendation.title }}</span>
                <span style="color: var(--term-gray);"> by </span>
                <span style="color: var(--term-cyan);">{{ recommendation.author }}</span>
            </div>
            <div style="color: var(--term-white); font-size: 0.875rem; line-height: 1.6; margin-bottom: 1rem;" class="typewriter-text">
                {{ recommendation.reason }}
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <a href="https://open.spotify.com/search/{{ recommendation.title|urlencode }}" target="_blank" class="btn" style="padding: 0.375rem 0.75rem; font-size: 0.75rem;">
                    search on spotify
                </a>
                <button class="btn" style="padding: 0.375rem 0.75rem; font-size: 0.75rem; border-color: var(--term-gray); color: var(--term-gray);"
                        hx-get="{% url 'ai-recommendation' %}"
                        hx-target="#ai-result"
                        hx-swap="innerHTML"
                        hx-indicator="#ai-loading">
                    regenerate
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.typewriter-text {
    animation: fadeIn 0.5s ease-out;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
